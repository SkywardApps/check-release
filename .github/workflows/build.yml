name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ mainline ]

permissions:
  contents: read

# Cancel superseded runs for the same pull request; push runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for tags and branches
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Fix line endings and run build script
        run: |
          sed -i 's/\r$//' ./build_check_release.sh
          chmod +x ./build_check_release.sh
          ./build_check_release.sh
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: check-release-builds
          path: check_release_dist/
          retention-days: 7
